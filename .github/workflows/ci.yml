name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The engine is the deliverable, so its suite runs on its own and its
      # benchmark fails the build if a solve crosses the 5ms budget.
      - name: Engine tests
        run: npm run test:engine

      # Spins up an in-memory MongoDB; no service container needed.
      - name: API tests
        run: npm run test:api

      # The gesture arithmetic behind canvas editing, plus the assertion that
      # one drag reaches all seven surfaces. No DOM needed for either.
      - name: Playground tests
        run: npm run test:web

      - name: Build the playground
        run: npm run build

      # Proof that the numbers quoted in the README still hold on a machine
      # that is not the author's.
      - name: Solve-time distribution
        if: matrix.node == '22'
        run: npm run perf
